<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROMPT LIBRARY</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div><p class="eyebrow">Sua coleção pessoal</p><h1>PROMPT LIBRARY</h1></div>
    <button id="add" class="primary">＋ Novo prompt</button>
  </header>
  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Buscar por título, descrição ou tag..." aria-label="Buscar prompts">
      <select id="category" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
    </section>
    <p id="count" class="muted"></p>
    <section id="list" class="grid" aria-live="polite"></section>
  </main>
  <dialog id="editor">
    <form id="form" method="dialog">
      <div class="dialog-head"><h2 id="form-title">Novo prompt</h2><button type="button" id="close" class="quiet" aria-label="Fechar">×</button></div>
      <input id="id" type="hidden">
      <label>Título<input id="title" required maxlength="100"></label>
      <label>Categoria<select id="form-category" required></select></label>
      <label>Descrição<input id="description" maxlength="180"></label>
      <label>Tags <small>Separe por vírgula</small><input id="tags" placeholder="ex.: escrita, trabalho"></label>
      <label>Texto do prompt<textarea id="prompt" rows="8" required></textarea></label>
      <label class="favorite"><input id="favorite" type="checkbox"> Marcar como favorito</label>
      <div class="actions"><button type="button" id="cancel" class="secondary">Cancelar</button><button class="primary">Salvar prompt</button></div>
    </form>
  </dialog>
  <script src="js/app.js"></script>
</body>
</html>
